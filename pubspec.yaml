
name: voter_app
description: "Electoral Information Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.6
  path: ^1.9.1
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  share_plus: ^13.3.1
  cloud_functions: ^7.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/db/
    - assets/branding/
    - assets/photos/CDM_W1/
    - assets/photos/CDM_W2/
    - assets/photos/CDM_W3/
    - assets/photos/CDM_W4/
    - assets/photos/CDM_W5/
    - assets/photos/CDM_W6/
    - assets/photos/CDM_W7/
    - assets/photos/CDM_W8/
    - assets/photos/CDM_W9/
    - assets/photos/CDM_W10/
    - assets/photos/CDM_W11/
    - assets/photos/CDM_W12/
    - assets/photos/CDM_W13/
    - assets/photos/CDM_W14/
    - assets/photos/CDM_W15/
    - assets/photos/CDM_W16/
    - assets/photos/CDM_W17/
    - assets/photos/CDM_W18/
    - assets/photos/CDM_W19/
    - assets/photos/CDM_W20/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
